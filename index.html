<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/src/assets/logo-simbolo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script type="text/javascript">
      function googleTranslateElementInit() {
        new google.translate.TranslateElement({pageLanguage: 'pt', includedLanguages: 'pt,en,es', autoDisplay: false}, 'google_translate_element');
      }
    </script>
    <script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
    <style>
      /* Hide Google Translate UI */
      #google_translate_element { position: absolute; top: -9999px; left: -9999px; opacity: 0; z-index: -1; pointer-events: none; }
      
      /* Hide the top banner and all its containers */
      .goog-te-banner-frame { display: none !important; }
      iframe.goog-te-banner-frame { display: none !important; }
      .skiptranslate > iframe.goog-te-banner-frame { display: none !important; }
      .VIpgJd-ZVi9od-aZ2wEe-wOHMyf { display: none !important; }
      .VIpgJd-ZVi9od-ORHb-OEVmcd { display: none !important; }
      #goog-gt-tt { display: none !important; }
      
      /* Reset body and html shifts caused by the banner */
      body { top: 0px !important; margin-top: 0px !important; position: static !important; }
      html { top: 0px !important; margin-top: 0px !important; position: static !important; }
      
      /* Hide hover tooltips and highlights */
      .goog-te-balloon-frame { display: none !important; }
      .goog-tooltip { display: none !important; }
      .goog-tooltip:hover { display: none !important; }
      .goog-text-highlight { background-color: transparent !important; border: none !important; box-shadow: none !important; }
    </style>
    <title>flycast</title>
  </head>
  <body>
    <div id="google_translate_element"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
